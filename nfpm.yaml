# nfpm config for the auditsh deb/rpm. Built by ./pkg.sh (sets VERSION, ARCH; stages binaries in stage/).
# The package installs files + the botaudit account only; the sshd drop-in ships DISABLED in
# /usr/share/auditsh and is enabled by `auditsh-setup --local --key ...`.
name: auditsh
arch: ${ARCH}
platform: linux
version: ${VERSION}
version_schema: none
release: "1"
section: admin
maintainer: ba0f3 <106477+ba0f3@users.noreply.github.com>
description: Read-only SSH audit ForceCommand/login shell for the botaudit account
homepage: https://github.com/ba0f3/auditsh
license: see repository
contents:
  - src: stage/auditsh
    dst: /usr/local/sbin/auditsh
    file_info: {mode: 0755, owner: root, group: root}
  - src: install.sh
    dst: /usr/sbin/auditsh-setup
    file_info: {mode: 0755, owner: root, group: root}
  - src: allowlist.yaml
    dst: /etc/auditsh/allowlist.yaml
    type: config|noreplace
    packager: deb
    file_info: {mode: 0644, owner: root, group: root}
  - src: stage/rpm/allowlist.yaml
    dst: /etc/auditsh/allowlist.yaml
    type: config|noreplace
    packager: rpm
    file_info: {mode: 0644, owner: root, group: root}
  # sudoers is security policy owned by the package (not a conffile): replaced on upgrade, removed on remove.
  - src: deploy/sudoers.botaudit
    dst: /etc/sudoers.d/botaudit
    packager: deb
    file_info: {mode: 0440, owner: root, group: root}
  - src: stage/rpm/sudoers.botaudit
    dst: /etc/sudoers.d/botaudit
    packager: rpm
    file_info: {mode: 0440, owner: root, group: root}
  - src: deploy/sshd_config.d/50-botaudit.conf
    dst: /usr/share/auditsh/50-botaudit.conf
    file_info: {mode: 0644, owner: root, group: root}
scripts:
  postinstall: packaging/postinstall.sh
  preremove: packaging/preremove.sh
  postremove: packaging/postremove.sh
overrides:
  deb:
    depends: [openssh-server, sudo, passwd]
  rpm:
    depends: [openssh-server, sudo, shadow-utils]
