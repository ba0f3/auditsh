# auditsh allowlist. Install as /etc/auditsh/allowlist.yaml (root:root 0644, dir root 0755).
# Each entry: name (what the client types), absolute path, optional sudo, and an ordered,
# fixed-arity list of args. Each arg is a regex anchored as ^(?:...)$. Any client arg that
# starts with '-' only matches a pattern that is a plain literal equal to it.
# Multiple entries with the same name = alternative forms (this is how optional args work).
# path "internal:procread" = served by auditsh itself (no cat binary is executed).
commands:
  - {name: ps, path: /usr/bin/ps, args: ['aux']}
  - {name: ps, path: /usr/bin/ps, args: ['-eo', '(pid|ppid|user|rss|vsz|%mem|%cpu|comm|etime|stat|nlwp)(,(pid|ppid|user|rss|vsz|%mem|%cpu|comm|etime|stat|nlwp)){0,10}']}
  - {name: ps, path: /usr/bin/ps, args: ['-eo', '(pid|ppid|user|rss|vsz|%mem|%cpu|comm|etime|stat|nlwp)(,(pid|ppid|user|rss|vsz|%mem|%cpu|comm|etime|stat|nlwp)){0,10}', '--sort=-rss']}
  - {name: ps, path: /usr/bin/ps, args: ['-eo', '(pid|ppid|user|rss|vsz|%mem|%cpu|comm|etime|stat|nlwp)(,(pid|ppid|user|rss|vsz|%mem|%cpu|comm|etime|stat|nlwp)){0,10}', '--sort=-%mem']}
  - {name: top, path: /usr/bin/top, args: ['-b', '-n1']}
  - {name: free, path: /usr/bin/free, args: []}
  - {name: free, path: /usr/bin/free, args: ['-m']}
  - {name: free, path: /usr/bin/free, args: ['-h']}
  - {name: cat, path: 'internal:procread', args: ['/proc/(meminfo|[1-9][0-9]{0,9}/(status|smaps_rollup))']}
  - {name: ss, path: /usr/bin/ss, sudo: true, args: ['-tlnp']}
  - {name: ss, path: /usr/bin/ss, sudo: true, args: ['-ulnp']}
  - {name: systemctl, path: /usr/bin/systemctl, args: ['status', '[A-Za-z0-9@._-]{1,128}\.(service|socket|timer)', '--no-pager']}
  - {name: journalctl, path: /usr/bin/journalctl, args: ['-u', '[A-Za-z0-9@._-]{1,128}\.(service|socket|timer)', '--since', '(today|yesterday|[1-9][0-9]{0,3} ?(min|h|hour|hours|d|day|days) ago|[0-9]{4}-[0-9]{2}-[0-9]{2}( [0-9]{2}:[0-9]{2}(:[0-9]{2})?)?)', '--no-pager']}
  - {name: journalctl, path: /usr/bin/journalctl, args: ['-u', '[A-Za-z0-9@._-]{1,128}\.(service|socket|timer)', '--since', '(today|yesterday|[1-9][0-9]{0,3} ?(min|h|hour|hours|d|day|days) ago|[0-9]{4}-[0-9]{2}-[0-9]{2}( [0-9]{2}:[0-9]{2}(:[0-9]{2})?)?)', '--no-pager', '-n', '[1-9][0-9]{0,3}']}
  - {name: df, path: /usr/bin/df, args: []}
  - {name: df, path: /usr/bin/df, args: ['-h']}
  - {name: uptime, path: /usr/bin/uptime, args: []}
  - {name: dmesg, path: /usr/bin/dmesg, sudo: true, args: ['-T']}
  - {name: dmesg, path: /usr/bin/dmesg, sudo: true, args: ['-T', '--level=err']}
  - {name: dmesg, path: /usr/bin/dmesg, sudo: true, args: ['-T', '--level=err,warn']}
  - {name: dmesg, path: /usr/bin/dmesg, sudo: true, args: ['-T', '--level=emerg,alert,crit,err,warn']}

  # --- system audit -------------------------------------------------------------------------
  # Basic host-audit reads. Fixed argv only; nothing here writes, refreshes, execs or pages
  # (systemctl always gets --no-pager; the env already sets PAGER=cat, SYSTEMD_PAGER= ).
  # sudo entries must match deploy/sudoers.botaudit exactly (NOEXEC, no wildcards).
  # '# deb-only' / '# rpm-only' lines are dropped from the other package's copy by pkg.sh;
  # the release allowlist keeps both (a missing binary fails closed at exec time).
  # Not included: iptables (/usr/sbin/iptables is an alternatives symlink on Debian and Rocky
  # and auditsh refuses symlinked binaries; `nft list ruleset` shows iptables-nft rules too),
  # /etc/os-release (internal:procread is hard-limited to /proc; `uname -a` covers the kernel).
  # who: current logins (utmp read).
  - {name: who, path: /usr/bin/who, args: []}
  # last -n N: recent logins from wtmp, bounded to 1..9999 lines.
  - {name: last, path: /usr/bin/last, args: ['-n', '[1-9][0-9]{0,3}']}
  # uname -a: kernel version/arch.
  - {name: uname, path: /usr/bin/uname, args: ['-a']}
  # installed packages (version/patch audit). dpkg-query directly, not the dpkg front end.
  - {name: dpkg-query, path: /usr/bin/dpkg-query, args: ['-l']}  # deb-only
  - {name: rpm, path: /usr/bin/rpm, args: ['-qa']}  # rpm-only
  # failed units and scheduled timers.
  - {name: systemctl, path: /usr/bin/systemctl, args: ['list-units', '--failed', '--no-pager']}
  - {name: systemctl, path: /usr/bin/systemctl, args: ['list-timers', '--no-pager']}
  # local accounts and groups (no shadow data).
  - {name: getent, path: /usr/bin/getent, args: ['passwd']}
  - {name: getent, path: /usr/bin/getent, args: ['group']}
  # root-only reads (sudo): effective sshd config, root's crontab, firewall ruleset, audit rules.
  - {name: sshd, path: /usr/sbin/sshd, sudo: true, args: ['-T']}
  - {name: crontab, path: /usr/bin/crontab, sudo: true, args: ['-l', '-u', 'root']}
  - {name: nft, path: /usr/sbin/nft, sudo: true, args: ['list', 'ruleset']}
  - {name: auditctl, path: /usr/sbin/auditctl, sudo: true, args: ['-l']}
