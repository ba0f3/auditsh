name: ci
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
env:
  GOTOOLCHAIN: local
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Go 1.27.3 (sha256-pinned tarball)
        run: |
          set -eu
          curl -fsSL --proto =https --tlsv1.2 -o /tmp/go.tgz https://go.dev/dl/go1.27.3.linux-amd64.tar.gz
          echo "65efbc80fdc1fa2cd2631cad5b481777a68e8725f34e89f50fc6ac714e379b40  /tmp/go.tgz" | sha256sum -c -
          sudo rm -rf /usr/local/go && sudo tar -C /usr/local -xzf /tmp/go.tgz && rm /tmp/go.tgz
          echo /usr/local/go/bin >> "$GITHUB_PATH"
      - name: Install tools (shellcheck from the runner image; actionlint pinned)
        run: |
          set -eu
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: make test
      - name: Smoke fuzz (30s per native fuzz target; long runs are done offline with make fuzz-long)
        run: make fuzz FUZZTIME=30s
      - name: build.sh twice per arch and compare
        run: |
          set -eu
          for arch in amd64 arm64; do
            GOARCH=$arch OUT=/tmp/a-$arch ./build.sh "$GITHUB_SHA"
            GOARCH=$arch OUT=/tmp/b-$arch ./build.sh "$GITHUB_SHA"
            cmp /tmp/a-$arch /tmp/b-$arch
          done
      - name: Lint (gofmt, shellcheck, actionlint, action SHA pins, visudo, goreleaser check)
        run: make lint
      - name: GoReleaser snapshot twice (pinned + sha256-verified) and compare; goreleaser binaries == build.sh
        run: |
          set -eu
          make snapshot && cp release/SHA256SUMS /tmp/sums1
          make snapshot && cmp /tmp/sums1 release/SHA256SUMS
          for arch in amd64 arm64; do cmp /tmp/a-$arch release/auditsh-linux-$arch; done
      - name: govulncheck v1.9.0 (version-pinned module, checksum-verified via go.sum DB)
        run: make vuln
