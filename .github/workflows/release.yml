name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write      # create the release
      id-token: write      # sigstore OIDC for attestation
      attestations: write  # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: false
      - name: Test
        env:
          GOTOOLCHAIN: local
        run: |
          go vet ./...
          go test -count=1 ./...
      - name: Build (reproducible, build.sh)
        env:
          GOTOOLCHAIN: local
        run: |
          set -eu
          mkdir -p release
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" OUT="release/auditsh-linux-$arch" ./build.sh "$GITHUB_SHA"
          done
          cp allowlist.yaml release/allowlist.yaml
          cp deploy/sshd_config.d/50-botaudit.conf release/50-botaudit.conf
          cp deploy/sudoers.botaudit release/sudoers.botaudit
          cp install.sh release/install.sh
          cd release && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/auditsh-linux-*
            release/allowlist.yaml
            release/50-botaudit.conf
            release/sudoers.botaudit
            release/install.sh
            release/SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --verify-tag --generate-notes release/*
