# /etc/ssh/sshd_config.d/50-botaudit.conf  (root:root 0644)
# Requires sshd_config to have "Include /etc/ssh/sshd_config.d/*.conf" (Debian/Ubuntu default,
# placed at the top). OpenSSH ends a Match block at the end of an included file, so this block
# cannot swallow later settings. Check: sshd -t && sshd -T -C user=botaudit,host=x,addr=192.0.2.10
# Global PermitUserEnvironment must stay "no" (default; not allowed inside Match).
Match User botaudit
    AuthorizedKeysFile /etc/ssh/authorized_keys/%u
    ForceCommand /usr/local/sbin/auditsh
    ExposeAuthInfo yes
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PermitTTY no
    DisableForwarding yes
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTunnel no
    PermitUserRC no
    PermitListen none
    PermitOpen none
    MaxSessions 2
    ClientAliveInterval 30
    ClientAliveCountMax 2
